<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="color-scheme" content="light"><title>Cincomancia</title><style>

:root {
	color-scheme: light;
	--ink: #2b1d10;
	--parchment: #e8d9b0;
	--parchment-dim: #d9c799;
	--wood: #4a3826;
	--gold: #cf9a35;
	--gold-hover: #dcac4f;
	--gold-shadow: #96701f;
	--gold-active: #b98726;
	--muted: #6b5638;
	--chip-bg: #ffffff;
	--chip-border: rgba(43,29,16,.35);
	--chip-shadow: rgba(43,29,16,.2);
	--outline: #2b1d10;

	/* extracted from the game's own art -- the 5 wand-tag colors */
	--violet: #EE7EEB;
	--electric-aqua: #46E0EC;
	--banana-cream: #FFE964;
	--royal-gold: #EDCF54;
	--wisteria-blue: #88A5E2;
	--dusty-mauve: #8C78A0;
}

html { background: var(--wood); }
body { margin: 0; }
html, body, div, img { user-select: none; /* No prefix supported by Chrome and Opera */
                   -ms-user-select: none; /* Internet Explorer/Edge */
                  -moz-user-select: none; /* Firefox */
                -khtml-user-select: none; /* Konqueror IHTML */
               -webkit-user-select: none; /* Safari */
             -webkit-touch-callout: none; /* iOS Safari */
overflow: hidden
}
div, img { position: absolute }
#chrome, #wandsWrap, #controlsGroup { position: static; }

/* All 5 wands always stay in one row, scaled as a single unit to fit
   whatever width is available (like the original tool) -- rather than
   wrapping into multiple rows or using a fixed size. #chrome (legend+
   reset) is separate, real HTML outside this scaled row, so it stays
   legible at any scale instead of shrinking along with the grid. */
#wandsWrap { overflow: hidden; }

#wandsRow {
	display: flex;
	gap: 14px;
	transform-origin: 0 0;
}

.wandCard {
	position: relative;
	z-index: 0;
	width: 354px;
	height: 754px;
	background: var(--parchment);
	border: 3px solid var(--outline);
	border-radius: 8px;
	box-sizing: border-box;
	box-shadow: 0 4px 10px rgba(0,0,0,.25);
	flex: 0 0 auto;
	/* .wandTag straddles this card's top border by design (its top is
	   negative -- see tag.style.top below); the blanket `div{overflow:
	   hidden}` rule above would otherwise clip the badge's top edge right
	   where the border line is, instead of it sitting cleanly on top. */
	overflow: visible;
}

.grid { width: 330px; height: 660px; z-index: -1 }
.boxOuter { width: 66px; height: 66px; z-index: -2 }
.boxFull  { width: 66px; height: 66px }
.boxRight { width: 24px; height: 24px }
.boxLeft  { width: 42px; height: 24px }
.boxUpper { width: 66px; height: 42px }

#chrome {
	box-sizing: border-box;
	width: 100%;
	display: flex;
	align-items: center;
	flex-wrap: wrap;
	gap: 10px;
	padding: 6px 10px;
	background: var(--parchment);
	border: 3px solid var(--outline);
	box-shadow: 0 4px 12px rgba(0,0,0,.3);
	position: relative;
	z-index: 2;
	/* the blanket `div{overflow:hidden}` rule above would otherwise clip
	   the legend tooltips right at this bar's own edge, since they're
	   meant to pop up above it */
	overflow: visible;
}

/* Shared by every button in the chrome bar (Reset, the injected Force
   refresh, the theme cycler) so they all get the same tactile press
   animation instead of some having it and some not. */
.chromeBtn {
	font: 700 12px/1 -apple-system, "Helvetica Neue", Arial, sans-serif;
	color: var(--ink);
	background: var(--gold);
	border: 2px solid var(--ink);
	border-radius: 6px;
	padding: 7px 13px;
	cursor: pointer;
	white-space: nowrap;
	flex: 0 0 auto;
	box-shadow: 0 3px 0 var(--gold-shadow);
	transition: transform .05s, box-shadow .05s;
}
.chromeBtn:hover { background: var(--gold-hover); }
.chromeBtn:active {
	background: var(--gold-active);
	transform: translateY(3px);
	box-shadow: none;
}

/* Everything but the legend is grouped here so wrapping (on a narrow
   window) moves this whole cluster to its own line as one unit, instead
   of individual buttons peeling off and stranding alone. margin-left:auto
   pushes the whole group to the right edge when there's room. */
#controlsGroup {
	display: flex;
	align-items: center;
	flex-wrap: wrap;
	gap: 10px;
	margin-left: auto;
}

/* Fixed width (sized for the longest label, "Legacy") so the button
   doesn't change size -- and therefore doesn't make the row's wrapping
   jump around -- as you cycle between theme names of different lengths. */
#themeButton { min-width: 92px; }

#legend {
	list-style: none;
	margin: 0;
	padding: 0;
	display: flex;
	flex-wrap: wrap;
	gap: 4px 8px;
}
#legend li {
	display: flex;
	align-items: center;
	gap: 4px;
	font: 600 11px/1.2 -apple-system, "Helvetica Neue", Arial, sans-serif;
	color: var(--ink);
	white-space: nowrap;
	background: var(--chip-bg);
	border: 1px solid var(--chip-border);
	box-shadow: 0 1px 0 var(--chip-shadow);
	border-radius: 20px;
	padding: 2px 8px 2px 3px;
	cursor: help;
	position: relative;
}

/* Global hover tooltip: a single floating element repositioned in JS
   (see showTip/hideTip below) rather than a per-item CSS ::after, so it
   can be clamped to stay inside the viewport instead of clipping off the
   edge when the target is near a border or the window edge. */
#gtip {
	position: fixed;
	z-index: 9999;
	background: var(--ink);
	color: var(--parchment);
	font: 600 12px/1.3 -apple-system, "Helvetica Neue", Arial, sans-serif;
	padding: 6px 9px;
	border-radius: 6px;
	max-width: 220px;
	pointer-events: none;
	opacity: 0;
	transition: opacity .12s;
}
#legend .sw {
	display: inline-block;
	width: 11px;
	height: 11px;
	border-radius: 3px;
	border: 1px solid rgba(0,0,0,.4);
	flex: 0 0 auto;
}

.wandTag {
	width: 18px;
	height: 16px;
	border-radius: 50%;
	border: 2px solid var(--ink);
	color: var(--ink);
	font: 700 11px/14px -apple-system, "Helvetica Neue", Arial, sans-serif;
	text-align: center;
	padding-top: 2px;
	z-index: 1;
}

/* Hidden by default -- only shown (via .show, toggled in recalc()) on the
   one wand currently being asked "which slot does this go in?", not all
   the time. */
.slotNum {
	width: 14px;
	height: 14px;
	border-radius: 50%;
	background: rgba(232,217,176,.9);
	border: 1px solid var(--ink);
	color: var(--ink);
	font: 700 9px/13px -apple-system, "Helvetica Neue", Arial, sans-serif;
	text-align: center;
	z-index: 1;
	pointer-events: none;
	opacity: 0;
	transition: opacity .1s;
}
.slotNum.show { opacity: 1; }

</style></head><body>

<div id="wandsWrap"><div id="wandsRow"></div></div>

<div id="chrome">
	<ul id="legend"></ul>
	<div id="controlsGroup">
		<button id="resetButton" class="chromeBtn">Reset</button>
		<button id="themeButton" class="chromeBtn" type="button"></button>
	</div>
</div>

<div id="gtip"></div>

<script type="text/javascript">

var wandsRowEl = document.getElementById('wandsRow');
var wandsWrapEl = document.getElementById('wandsWrap');

var NATIVE_ROW_W = 5 * 354 + 4 * 14; // 5 cards + the gaps between them
var NATIVE_ROW_H = 754;

function updateWandsScale() {
  var w = document.body.clientWidth || window.innerWidth;
  var scale = w / NATIVE_ROW_W;
  wandsRowEl.style.transform = 'scale(' + scale + ')';
  wandsWrapEl.style.height = (NATIVE_ROW_H * scale) + 'px';
}

// ------------------------------------------------------------
// Global hover tooltip -- one floating element, repositioned per-target
// on hover and clamped to the viewport so it can't clip off the top/side
// of the window even when the target sits right at an edge.
// ------------------------------------------------------------
var gtipEl = document.getElementById('gtip');

// Shared with index.html's "Board tips" toggle via the same localStorage key
// it already writes (automancia_hover_tips) -- more robust than reaching for
// a live property on window.parent, and the same cross-doc approach the
// theme already relies on. Unlike the always-on legend tooltips above, this
// gate only applies to the new effect/slot tooltips.
function boardTipsEnabled() {
  return (localStorage.getItem('automancia_hover_tips') || 'on') === 'on';
}
window.addEventListener('storage', function(e) {
  if (e.key === 'automancia_hover_tips' && e.newValue !== 'on') gtipHide();
});

function gtipShowText(el, text) {
  if (!text) return;
  gtipEl.textContent = text;
  gtipEl.style.left = '0px';
  gtipEl.style.top = '0px';
  gtipEl.style.opacity = '1';

  var r = el.getBoundingClientRect();
  var tw = gtipEl.offsetWidth;
  var th = gtipEl.offsetHeight;

  var x = r.left + r.width / 2 - tw / 2;
  x = Math.max(6, Math.min(x, window.innerWidth - tw - 6));

  var y = r.top - th - 8;
  if (y < 6) y = r.bottom + 8; // not enough room above -- show below instead

  gtipEl.style.left = x + 'px';
  gtipEl.style.top = y + 'px';
}

function gtipShow() {
  gtipShowText(this, this.getAttribute('data-tip'));
}

function gtipHide() {
  gtipEl.style.opacity = '0';
}

function initTooltips(root) {
  (root || document).querySelectorAll('[data-tip]').forEach(function(el) {
    el.addEventListener('mouseenter', gtipShow);
    el.addEventListener('mouseleave', gtipHide);
  });
}

// ------------------------------------------------------------
// Theme cycling: 4 color-scheme presets applied by overriding the CSS
// custom properties everything else already reads from. Persisted in
// localStorage, which is shared with the parent page (same origin) --
// automancia's index.html listens for the `storage` event to pick up a
// change made here live, without needing to reload.
// ------------------------------------------------------------
var THEME_ORDER = ['cinco', 'light', 'dark', 'old'];
var THEME_LABEL = { cinco: 'Cinco', light: 'Light', dark: 'Dark', old: 'Legacy' };
var THEMES = {
  // the parchment/gold look this whole redesign has been using -- not a
  // generic "light mode", it's this project's own theme, so it's named
  // for the game instead.
  cinco: { ink: '#2b1d10', parchment: '#e8d9b0', wood: '#4a3826', gold: '#cf9a35', goldHover: '#dcac4f', goldShadow: '#96701f', goldActive: '#b98726', muted: '#6b5638',
           chipBg: '#ffffff', chipBorder: 'rgba(43,29,16,.35)', chipShadow: 'rgba(43,29,16,.2)', outline: '#2b1d10' },
  // an actual clean/neutral light mode, distinct from "cinco"
  light: { ink: '#1c1c1e', parchment: '#ffffff', wood: '#eef0f2', gold: '#3b82f6', goldHover: '#2f6fd6', goldShadow: '#1d4ed8', goldActive: '#2563eb', muted: '#6b7280',
           chipBg: '#ffffff', chipBorder: 'rgba(0,0,0,.15)', chipShadow: 'rgba(0,0,0,.08)', outline: '#1c1c1e' },
  // deliberately just 2 near-black grays + white text + gold accent --
  // not a tinted brown like the others, and no more colors than that.
  // outline is black (not --ink/white) so panel edges disappear into the
  // black background instead of drawing a bright box around everything.
  dark:  { ink: '#ffffff', parchment: '#1a1a1a', wood: '#000000', gold: '#caa53d', goldHover: '#dab659', goldShadow: '#8a6f26', goldActive: '#a5822c', muted: '#999999',
           chipBg: '#0d0d0d', chipBorder: 'rgba(255,255,255,.25)', chipShadow: 'rgba(0,0,0,.6)', outline: '#000000' },
  old:   { ink: '#222222', parchment: '#d4d0c8', wood: '#383735', gold: '#b0aca0', goldHover: '#c2beb2', goldShadow: '#7d7a70', goldActive: '#948f83', muted: '#555555',
           chipBg: '#ffffff', chipBorder: 'rgba(0,0,0,.3)', chipShadow: 'rgba(0,0,0,.15)', outline: '#222222' }
};
var THEME_DEFAULT = 'cinco';

function applyTheme(name) {
  var t = THEMES[name] || THEMES[THEME_DEFAULT];
  var root = document.documentElement.style;
  root.setProperty('--ink', t.ink);
  root.setProperty('--parchment', t.parchment);
  root.setProperty('--wood', t.wood);
  root.setProperty('--gold', t.gold);
  root.setProperty('--gold-hover', t.goldHover);
  root.setProperty('--gold-shadow', t.goldShadow);
  root.setProperty('--gold-active', t.goldActive);
  root.setProperty('--muted', t.muted);
  root.setProperty('--chip-bg', t.chipBg);
  root.setProperty('--chip-border', t.chipBorder);
  root.setProperty('--chip-shadow', t.chipShadow);
  root.setProperty('--outline', t.outline);
  root.setProperty('--violet', t.violet || '#EE7EEB');
  root.setProperty('--electric-aqua', t.electricAqua || '#46E0EC');
  root.setProperty('--banana-cream', t.bananaCream || '#FFE964');
  root.setProperty('--royal-gold', t.royalGold || '#EDCF54');
  root.setProperty('--wisteria-blue', t.wisteriaBlue || '#88A5E2');
  root.setProperty('--dusty-mauve', t.dustyMauve || '#8C78A0');
  var btn = document.getElementById('themeButton');
  if (btn) btn.textContent = 'Theme: ' + THEME_LABEL[name];
}

function cycleTheme() {
  var cur = localStorage.getItem('automancia_theme') || THEME_DEFAULT;
  var next = THEME_ORDER[(THEME_ORDER.indexOf(cur) + 1) % THEME_ORDER.length];
  localStorage.setItem('automancia_theme', next);
  applyTheme(next);
}

applyTheme(localStorage.getItem('automancia_theme') || THEME_DEFAULT);
document.getElementById('themeButton').onclick = cycleTheme;
window.addEventListener('storage', function(e) {
  if (e.key === 'automancia_theme') applyTheme(e.newValue || THEME_DEFAULT);
});

onbeforeunload = function() {
  return "Confirm to leave / refresh page. Data won't be saved.";
};

var FX = [
  {name: 'Instante'}, // 0
  {name: 'Morte de Galo'},
  {name: 'Morte de Sapo'},
  {name: 'Morte de Lagarto'},
  {name: 'O Fogo'},

  {name: 'Raiz Esquerda'},
  {name: 'Curar da Terra'},
  {name: 'Braco Direito Forte'}
];

var ban = [];

for (var i = 0; i < 50; i++) {
  var x = FX[i];
  window[x.name.replace(/ \S/g, function(s){return s.charAt(1).toUpperCase();})] = x;
  x.id = i;
  x.x = i % 5;
  x.y = Math.floor(i / 5);
  x.max = 2;
  ban.push([]);
  for (var j = 0; j < 50; j++) {
    ban[i].push(i === j);
  }
}

function ex(x, y) {
  var n;
  var i;
  if (Array.isArray(x)) {
    n = x.length;
    for (i = 0; i < n; i++) {
      ex(x[i], y);
    }
    return;
  }
  if (Array.isArray(y)) {
    n = y.length;
    for (i = 0; i < n; i++) {
      ex(x, y[i]);
    }
    return;
  }
  ban[x.id][y.id] = true;
}

// mutually exclude (y cannot appear below x, x cannot appear below y)
function mutex(x, y) {
  var n;
  var i;
  if (!y) {
    n = x.length;
    var m = n - 1;
    for (i = 0; i < m; i++) {
      for (var j = i + 1; j < n; j++) {
        mutex(x[i], x[j]);
      }
    }
    return;
  }
  if (Array.isArray(x)) {
    n = x.length;
    for (i = 0; i < n; i++) {
      mutex(x[i], y);
    }
    return;
  }
  if (Array.isArray(y)) {
    n = y.length;
    for (i = 0; i < n; i++) {
      mutex(x, y[i]);
    }
    return;
  }
  ex(x, y);
  ex(y, x);
}

var WARP = [TeleporteOutro, UrdiduraDoTempo];
var TESOURO = [TesouroPerdido, TesouroEscondido];

var MORTE = [MorteDeGalo, MorteDeSapo, MorteDeLagarto, CoquetelDeCamarao];
var AGGRO = [MORTE, ImparEPar, OTerremoto, Sangue, Golias, AlvoPreciso, Acabar, Senha, Ataque];
var DEBUFF = [Esgotar, Dormir, OToxico];
var CONTROL = [Caro, DEBUFF, Duplicar, Polimorfo, WARP];

function setJogoRules(jogo) {
  if (jogo < 5) {
    ex(Ataque, [CoquetelDeCamarao,MorteDeLagarto,MorteDeSapo,MorteDeGalo,Acabar,Golias,ImparEPar,AlvoPreciso,Sangue,OEspelho]);
    ex(OFogo, [TeleporteOutro,UrdiduraDoTempo]);
    ex(Explosao, [TeleporteOutro]);
    ex(Senha, [CoquetelDeCamarao,Mascara,MorteDeLagarto,MorteDeSapo,MorteDeGalo,Golias,ImparEPar,AlvoPreciso,Sangue,OEspelho]);
    ex(CoquetelDeCamarao, [OEspelho]);
    ex(MorteDeLagarto, [OEspelho]);
    ex(MorteDeSapo, [OEspelho]);
    ex(MorteDeGalo, [OEspelho]);
    ex(Acabar, [Senha,OEspelho]);
    ex(Golias, [OEspelho]);
    ex(ImparEPar, [CoquetelDeCamarao,OEspelho]);
    ex(AlvoPreciso, [CoquetelDeCamarao,OEspelho,Dourado]);
    ex(Sangue, [CoquetelDeCamarao,OEspelho,RaioCurto]);
    ex(CamaraoNovo, [Explosao,Duplicar]);
    ex(BracoDireitoForte, [Dourado]);
    ex(Teleporte, [Explosao]);
    ex(TeleporteOutro, [Ataque,Senha,CoquetelDeCamarao,Mascara,MorteDeLagarto,MorteDeSapo,MorteDeGalo,Acabar,Golias,ImparEPar,AlvoPreciso,Sangue,Dormir,Polimorfo,Duplicar,OToxico,OEspelho,Colecao,Dourado,Caro,OTerremoto]);
    ex(Dormir, [Ataque,Senha,CoquetelDeCamarao,MorteDeLagarto,MorteDeSapo,MorteDeGalo,Acabar,Golias,ImparEPar,AlvoPreciso,Sangue,Caro,OTerremoto]);
    ex(Polimorfo, [Ataque,Senha,CoquetelDeCamarao,Mascara,MorteDeLagarto,MorteDeSapo,MorteDeGalo,Acabar,Golias,ImparEPar,AlvoPreciso,Sangue,Duplicar,OEspelho,OTerremoto]);
    ex(Duplicar, [Ataque,Senha,ImparEPar,OToxico,Caro]);
    ex(OToxico, [Ataque,Senha,CoquetelDeCamarao,MorteDeLagarto,MorteDeSapo,MorteDeGalo,Acabar,Golias,ImparEPar,AlvoPreciso,Sangue,Caro,OTerremoto]);
    ex(UrdiduraDoTempo, [Ataque,Senha,CoquetelDeCamarao,Mascara,MorteDeLagarto,MorteDeSapo,MorteDeGalo,Acabar,Golias,ImparEPar,AlvoPreciso,Sangue,Dormir,Polimorfo,Duplicar,OToxico,OEspelho,Colecao,Caro,OTerremoto]);
    ex(OEspelho, [Dourado]);
    ex(Demolicao, [OPilar]);
    ex(OsEspinhos, [TeleporteOutro,UrdiduraDoTempo]);
    ex(Colecao, [Golias,Duplicar]);
    ex(TesouroPerdido, [TeleporteOutro,Polimorfo,UrdiduraDoTempo,Colecao]);
    ex(TesouroEscondido, [TeleporteOutro,Polimorfo,UrdiduraDoTempo,Colecao]);
    ex(OPilar, [RaizEsquerda,Colecao]);
    ex(Dourado, [Golias,RaizEsquerda,Colecao]);
    ex(Penetracao, [Dourado]);
    ex(Envolver, [Duplicar]);
    ex(RaioCurto, [Golias,CamaraoNovo,Dourado]);
    ex(Instante, [Adicional]);
    ex(Identificar, [Esquecer]);
    ex(Caro, [Ataque,Senha,CoquetelDeCamarao,MorteDeLagarto,MorteDeSapo,MorteDeGalo,Acabar,Golias,ImparEPar,AlvoPreciso,Sangue,OEspelho,OTerremoto]);
    ex(OTerremoto, [OEspelho]);

    mutex(Ataque, [Mascara,Esgotar]);
    mutex(OFogo, [Esgotar]);
    mutex(Detritos, [Esgotar]);
    mutex(Explosao, [Esgotar]);
    mutex(Senha, [Esgotar]);
    mutex(CoquetelDeCamarao, [Esgotar]);
    mutex(Mascara, [Ataque,Esgotar]);
    mutex(MorteDeLagarto, [Esgotar]);
    mutex(MorteDeSapo, [Esgotar]);
    mutex(MorteDeGalo, [Esgotar]);
    mutex(Acabar, [Esgotar]);
    mutex(Golias, [Duplicar,Esgotar]);
    mutex(ImparEPar, [Esgotar,RaioCurto]);
    mutex(AlvoPreciso, [Esgotar]);
    mutex(Sangue, [Esgotar]);
    mutex(CamaraoNovo, [Teleporte,Esgotar]);
    mutex(CurarDaTerra, [Esgotar]);
    mutex(BracoDireitoForte, [Esgotar]);
    mutex(AEnergia, [Duplicar,Esgotar,TesouroPerdido,TesouroEscondido,OPilar,Dourado]);
    mutex(RaizEsquerda, [Esgotar]);
    mutex(Teleporte, [CamaraoNovo,Esgotar]);
    mutex(TeleporteOutro, [Esgotar,UrdiduraDoTempo]);
    mutex(Dormir, [Esgotar]);

// The main page (index.html, same-origin) keeps the English effect names

function englishEffectName(id) {
  try {
    var names = window.parent.effectMapName;
    return names && names[id] ? names[id].replace(/\b\w/g, function(c) { return c.toUpperCase(); }) : null;
  } catch (e) { return null; }
}

function cellTipText(w, i) {

  var name = FX[i].name + (en ? ' — ' + en : '');

  return status ? name + ' (' + status + ')' : name;
}

function slotTipText(w, j) {
  var s = state.slots[w][j];
  if (s[1] === -1) return 'Slot ' + (j + 1) + ': not yet confirmed';
  var en = englishEffectName(s[1]);

function newState(arrs) {
  var cells = [];
  var slots = [];
  for (var i = 0; i < 5; i++) {
    var a = [];
    var j;
    for (j = 0; j < 50; j++) {
      a.push(arrs ? [CLEAN, CLEAN, CLEAN, CLEAN, CLEAN, -1] : [CLEAN, -1]);
    }
    cells.push(a);
    a = [];
    for (j = 0; j < 5; j++) {
      a.push([CLEAN, -1]);
    }
    slots.push(a);
  }
  return { cells: cells, slots: slots };
}

var timelines = [[], [], [], [], []];

var state = newState(false);

function getImg(i) {
  return i === -1 ? null : 'url(cincomancia.png) -' + (FX[i].x * 66) + 'px -' + (FX[i].y * 66) + 'px';
}

function getNumero(s) {
  return s[1] === -1 ? null : 'url(cinconumeros.png) 0 -' + (s[1] * 24) + 'px';
}

var cells = [];
var slots = [];

function colorCell(w, i) {
  var s = state.cells[w][i];
  var col = COLOR[s[0]];
  var num = getNumero(s);
  var cell = cells[w][i];
  if (cell.outer.style.backgroundColor !== col) {
    cell.outer.style.backgroundColor = col;
  }
  if (cell.right.style.background !== num) {
    cell.right.style.background = num;
  }
}

function timeSplice(w, i, n) {
  var timeline = timelines[w];
  for (var j = timeline.length - 1; j >= 0; j--) {
    if (timeline[j][0] === i) {
      if (n) {
        timeline[j][2] = n;
      } else {
        timeline.splice(j, 1);
        timeSplice(w, i, n);
        return;
      }
    }
  }
}

function cellClicked(w, i, numero) {
  var s = state.cells[w][i];
  var s0 = s[0];
  if (s0 !== EXCL && s[1] === -1 || s0 === MARK+TINT) {
    timeSplice(w, i);
    timelines[w].push([i, false, 5]);
    state.cells[w][i] = [MARK, 5];
    sel = [w, i];
  } else if (numero) {
    sel = (sel !== null && sel[0] === w && sel[1] === i) ? null : [w, i];
    recalc();
    return;
  } else if (s0 === MARK || s0 === EXCL) {
    timeSplice(w, i);
    state.cells[w][i] = [RED, 0];
    sel = [w, i];
  } else if (s0 === RED) {
    timelines[w].push([i, true]);
    state.cells[w][i][0] = FORG;
    sel = null;
  } else {
    timeSplice(w, i);
    state.cells[w][i] = [CLEAN, -1];
    sel = null;
  }
  colorCell(w, i);
  recalc();
}

function slotClicked(w, j) {
  var y = state.slots[w][j];
  if (sel === null) {
    if (y[1] === -1) {
      return;
    }
    sel = [w, y[1]];
  } else if (sel[0] !== w) {
    sel = y[1] === -1 ? null : [w, y[1]];
  } else if (y[1] === sel[1]) {
    sel = null;
  } else if (y[0] === RED && state.cells[w][sel[1]][0] === RED) {
    state.cells[w][y[1]][1] = state.cells[w][sel[1]][1];
    state.cells[w][sel[1]][1] = 1 + j;
    sel = [w, y[1]];
  } else {
    if (state.cells[w][sel[1]][0] === MARK) {
      timeSplice(w, sel[1], 1 + j);
    } else {
      state.cells[w][sel[1]][1] = 1 + j;
    }
    sel = null;
  }
  recalc();
}

function recalc() {
  var ns = newState(true);
  var count = [];
  var orig = [];
  var i;
  for (i = 0; i < 50; i++) {
    count.push(0);
  }
  var a;
  var j;
  for (i = 0; i < 5; i++) {
    a = [];
    for (j = 0; j < 5; j++) {
      a.push(-1);
    }
    orig.push(a);
  }
  var t;
  var n;
  var st;
  var pos;
  var y;
  var x;
  var k;
  var l;
  var banBefore;
  var banAfter;
  var last;
  var w;
  for (w = 0; w < 5; w++) {
    t = timelines[w];
    n = t.length;
    for (j = 0; j < n; j++) {
      y = t[j][0];
      if (t[j][1]) {
        st = state.cells[w][y];
        if (st[1] === 0) {
          count[y]++;
          for (k = 0; k < 50; k++) {
            if (ban[k][y] && ban[y][k] && k !== y) {
              x = ns.cells[w][k];
              for (l = 0; l < 5; l++) {
                if (x[l] === MARK || x[l] === EXCL) {
                  x[l] = FORG+TINT;
                }
              }
            }
          }
        } else {
          pos = st[1] - 1;
          if (orig[w][pos] === -1) {
            orig[w][pos] = FORG;
            count[y]++;
          }
          ns.slots[w][pos] = [FORG, y];
          for (k = 0; k < 50; k++) {
            if (k !== y) {
              x = ns.cells[w][k];
              x[pos] = FORG+TINT;
              banBefore = ban[k][y];
              banAfter = ban[y][k];
              if (banBefore || banAfter) {
                for (l = 0; l < 5; l++) {
                  if (l < pos) {
                    if (banBefore) {
                      x[l] = EXCL;
                    }
                  } else if (l > pos) {
                    if (banAfter) {
                      x[l] = EXCL;
                    }
                  }
                }
              }
            }
          }
        }
      } else {
        x = ns.cells[w][y];
        last = t[j][2];
        for (k = 0; k < last; k++) {
          if (x[k] === CLEAN || x[k] === FORG+TINT) {
            x[k] = MARK;
          }
        }
        x[5] = last;
      }
    }
  }
  var z;
  for (i = 0; i < 5; i++) {
    for (j = 0; j < 50; j++) {
      x = state.cells[i][j];
      if (x[0] === RED) {
        if (x[1] === 0) {
          count[j]++;
          for (k = 0; k < 50; k++) {
            if (ban[k][j] && ban[j][k] && k !== j) {
              z = ns.cells[i][k];
              for (l = 0; l < 5; l++) {
                z[l] = EXCL;
              }
            }
          }
        } else {
          pos = x[1] - 1;
          if (orig[i][pos] === -1) {
            orig[i][pos] = RED;
            count[j]++;
          }
          ns.slots[i][pos] = [RED, j];
          for (k = 0; k < 50; k++) {
            if (k !== j) {
              z = ns.cells[i][k];
              z[pos] = EXCL;
              banBefore = ban[k][j];
              banAfter = ban[j][k];
              if (banBefore || banAfter) {
                for (l = 0; l < 5; l++) {
                  if (l < pos) {
                    if (banBefore) {
                      z[l] = EXCL;
                    }
                  } else if (l > pos) {
                    if (banAfter) {
                      z[l] = EXCL;
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  var cleans;
  var marks;
  var forgs;
  var o;
  for (w = 0; w < 5; w++) {
    t = 0;
    for (i = 0; i < 5; i++) {
      if (ns.slots[w][i][0] !== RED) {
        t++;
      }
    }
    for (i = 0; i < 50; i++) {
      st = state.cells[w][i];
      if (st[0] === RED || st[0] === FORG) {
        ns.cells[w][i] = st;
      } else if (t === 0) {
        ns.cells[w][i] = [EXCL, -1];
      } else {
        cleans = 0;
        marks = 0;
        forgs = 0;
        x = ns.cells[w][i];
        if (i === Adicional.id) {
          x[0] = EXCL;
        }
        for (j = 0; j < 5; j++) {
          k = x[j];
          if (k === CLEAN) {
            cleans++;
          } else if (k === MARK) {
            marks++;
          } else if (k === FORG+TINT) {
            forgs++;
          }
        }
        o = FX[i].max - count[i];
        if (o < 0) {
          o = 0;
        }
        cleans *= o;
        marks *= o;
        if (cleans === 0) {
          z = forgs === 0 ? (marks === 0 ? EXCL : MARK) : FORG+TINT;
        } else if (marks === 0) {
          z = (FX[i].max * forgs + cleans) * 2 > FX[i].max * t ? CLEAN : EXCL+TINT;
        } else {
          z = MARK+TINT;
        }
        if (z === MARK || z === MARK+TINT) {
          ns.cells[w][i] = [z, x[5]];
        } else {
          ns.cells[w][i] = [z, -1];
        }
      }
    }
  }
  state = ns;
  for (i = 0; i < 5; i++) {
    for (j = 0; j < 50; j++) {
      colorCell(i, j);
    }
    for (j = 0; j < 5; j++) {
      var s = state.slots[i][j];
      st = s[0];
      var col;
      var img;
      if (sel === null || sel[0] !== i) {
        col = st === CLEAN ? null : COLOR[st];
      } else {
        t = state.cells[i][sel[1]];
        if (j === t[1] - 1) {
          col = COLOR[t[0]];
        } else {
          col = COLOR[st === RED ? RED+TINT : TINT];
        }
      }
      if (sel !== null && sel[0] === i && (t[0] === MARK || t[0] === MARK+TINT)) {
        col = COLOR[st === RED ? RED+TINT : TINT];
        img = getImg(s[1]);
      } else {
        img = getImg((sel !== null && sel[0] === i && state.cells[i][sel[1]][1] - 1 === j) ? sel[1] : s[1]);
      }
      var slot = slots[i][j];
      if (slot.outer.style.backgroundColor !== col) {
        slot.outer.style.backgroundColor = col;
      }
      if (slot.img.style.background !== img) {
        slot.img.style.background = img;
      }
      slot.num.classList.toggle('show', sel !== null && sel[0] === i);
    }

    cell.upper.style.top = '' + upper + 'px';
    cell.upper.style.left = '' + left + 'px';
    cell.upper.onmousedown = cellClicked.bind(null, i, j, false);
    cardEl.appendChild(cell.upper);

    // The three overlays (right/left/upper) fully tile the cell and paint
    // on top of it, so the hover listener has to live on them, not on
    // cell.outer underneath -- text is computed fresh each hover so it
    // stays right as the cell's state changes.
    (function(w, idx) {
      var onEnter = function() { if (boardTipsEnabled()) gtipShowText(this, cellTipText(w, idx)); };
      cell.right.addEventListener('mouseenter', onEnter);
      cell.right.addEventListener('mouseleave', gtipHide);
      cell.left.addEventListener('mouseenter', onEnter);
      cell.left.addEventListener('mouseleave', gtipHide);
      cell.upper.addEventListener('mouseenter', onEnter);
      cell.upper.addEventListener('mouseleave', gtipHide);
    })(i, j);

    a.push(cell);
  }
  cells.push(a);
  a = [];
  for (j = 0; j < 5; j++) {
    var slot = {};
    var left = (CARD_MARGIN + j*66) + 'px';
    slot.outer = document.createElement('div');
    slot.outer.className = 'boxOuter';
    slot.outer.style.top = SLOT_TOP + 'px';
    slot.outer.style.left = left;
    cardEl.appendChild(slot.outer);
    slot.img = document.createElement('img');
    slot.img.src = 'cinconada.png';
    slot.img.className = 'boxFull';
    slot.img.style.top = SLOT_TOP + 'px';
    slot.img.style.left = left;
    slot.img.onmousedown = slotClicked.bind(null, i, j);
    (function(w, idx) {
      slot.img.addEventListener('mouseenter', function() { if (boardTipsEnabled()) gtipShowText(this, slotTipText(w, idx)); });
      slot.img.addEventListener('mouseleave', gtipHide);
    })(i, j);
    cardEl.appendChild(slot.img);
    var slotNum = document.createElement('div');
    slotNum.className = 'slotNum';
    slotNum.textContent = j + 1;
    slotNum.style.top = (SLOT_TOP + 2) + 'px';
    slotNum.style.left = (CARD_MARGIN + j*66 + 2) + 'px';
    cardEl.appendChild(slotNum);
    slot.num = slotNum;
    a.push(slot);
  }
  slots.push(a);
}

document.getElementById('resetButton').onclick = function() {
  if (confirm('Reset everything?')) {
    timelines = [[], [], [], [], []];
    sel = null;
    state = newState(false);
    recalc();
  }
};

function forceReset() {
  timelines = [[], [], [], [], []];
  sel = null;
  state = newState(false);
  recalc();
}

if (window.location.href.indexOf("jogo=") != -1) {
  setJogoRules(Number(window.location.href.split("jogo=")[1]));
} else setJogoRules(5);

updateWandsScale();
window.addEventListener('resize', updateWandsScale);

if (location.hash.indexOf('#themetest=') === 0) {
  applyTheme(location.hash.slice(11));
}
</script></body></html>
